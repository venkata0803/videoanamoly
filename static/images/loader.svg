<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50">
  <circle cx="25" cy="25" r="20" fill="none" stroke="#00ff00" stroke-width="5" stroke-linecap="round" stroke-dasharray="94.248" stroke-dashoffset="0">
    <animateTransform
      attributeName="transform"
      type="rotate"
      dur="1s"
      values="0 25 25;360 25 25"
      repeatCount="indefinite"
