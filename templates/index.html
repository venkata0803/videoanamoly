<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anomaly Detection System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
    <div class="header">
        <div class="logo-container">
            <img class="logo" src="{{ url_for('static', filename='images/app_logo.png') }}" alt="Anomaly AI Logo">
            <h1 class="dashboard-heading">Anomaly Detection System</h1>
        </div>
    </div>

    <div class="container">
        <div class="upload-box">
            <h2>Upload Video</h2>
            <form action="/upload" method="POST" enctype="multipart/form-data">
                <div class="upload-area">
                    <input type="file" name="video" accept="video/*" required>
                </div>
                <button type="submit" class="btn">Upload Video</button>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/interface.js') }}"></script>
</body>
</html>
